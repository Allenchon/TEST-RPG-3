<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141314">
  <meta name="description" content="率領五人小隊探索北境地下的方格迷宮。">
  <title>Test RPG3｜北境地窟</title>
  <style>
:root {
  color-scheme: dark;
  --ink: #141314;
  --panel: #1b191a;
  --surface: #242021;
  --border: #3d3230;
  --gold: #ceaa78;
  --gold-bright: #efce9a;
  --rust: #a56247;
  --text: #eee2d1;
  --muted: #b5a398;
  --quiet: #9e897e;
  --serif: "Noto Serif TC", "Songti TC", "PMingLiU", Georgia, serif;
  --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  font: 100%/1.4 var(--sans);
  background: #0c0a0b;
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; color: var(--text); background: radial-gradient(ellipse at 50% 20%, #2a2020, #0c0a0b 70%); }
button, input, select, textarea { font: inherit; }
button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--gold-bright);
  outline-offset: 2px;
}
button[disabled] { opacity: .44; cursor: default; }

#game {
  position: relative;
  width: 100%;
  max-width: 450px;
  min-height: 100svh;
  margin-inline: auto;
  background: var(--ink);
  box-shadow: 0 0 94px #0009, 0 0 0 1px #302725;
}
.screen { display: flex; flex-direction: column; min-height: max(844px, 100svh); }
.boot { margin: 0; padding: 32px 20px; color: var(--gold); }
h1, h2, h3, p { margin: 0; }
.icon { display: inline-grid; place-items: center; flex: none; line-height: 1; min-width: 1em; color: var(--gold); }
.button {
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 56px;
  min-width: 0;
  padding: 8px 13px;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  background: linear-gradient(160deg, #2b2424, #211c1e);
  font-weight: 650;
  cursor: pointer;
}
.button:hover:not(:disabled) { background: linear-gradient(160deg, #3a2d29, #2b2221); border-color: #6b5141; }
.button:active:not(:disabled) { box-shadow: inset 0 2px 6px #08060980; }
.button.primary {
  border-color: #ad815e;
  background: linear-gradient(180deg, #754732 0%, #5c3529 100%);
  color: #fff2dc;
  box-shadow: inset 0 1px #edc58b42, 0 3px 12px #07060770;
  font-family: var(--serif);
  letter-spacing: .11em;
}
.button.primary:hover:not(:disabled) { background: linear-gradient(180deg, #8e593c, #6b3c2d); }
.primary .icon { color: #f6d4a2; }
.status-bar {
  height: 48px;
  flex: 0 0 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  color: var(--gold-bright);
  border-bottom: 1px solid #524036;
  background: linear-gradient(180deg, #221d1d, #171416);
}
.header-actions, .resource-list, .resource, .light-status { display: flex; align-items: center; gap: 7px; }
.resource-list { gap: 15px; }
.resource .icon { font-size: 17px; }
.resource b { font-size: .875rem; font-variant-numeric: tabular-nums; font-weight: 650; }
.icon-button {
  min-height: 34px;
  min-width: 34px;
  padding: 4px;
  color: var(--gold);
  border-color: #49372f;
  font-size: 18px;
  line-height: 1;
}
.header-actions .icon-button { font-size: 14px; }
.town-scene {
  position: relative;
  height: 256px;
  flex: 0 0 256px;
  display: flex;
  flex-direction: column;
  align-items: start;
  justify-content: space-between;
  padding: 21px 18px 15px;

.town-title { text-shadow: 0 2px 14px #000; }
.town-title p { color: #e7bd87; font: 650 .75rem/1.1 Georgia, serif; letter-spacing: .29em; }
.town-title h1 { margin-top: 4px; color: #f6e6cd; font: 700 clamp(2rem, 9.5vw, 2.55rem)/1.12 var(--serif); letter-spacing: .13em; }
.button.ledger {
  min-height: 41px;
  background: #211a1bdc;
  border-color: #9a76592b;
  color: #f0d6b3;
  box-shadow: inset 0 0 0 1px #af8a6214;
  font-size: .875rem;
}
.town-body { flex: 1; display: flex; flex-direction: column; padding: 10px 13px max(16px, env(safe-area-inset-bottom)); }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 30px; }
.section-head h2 { color: #d9c4ab; font: 650 1rem var(--serif); letter-spacing: .07em; }
.section-head span { color: var(--quiet); font-size: .8rem; }
.button.text-button { min-height: 32px; padding: 3px 0 3px 12px; border: 0; background: transparent; color: var(--gold); font-size: .8125rem; }
.party-strip {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 72px));
  gap: 4px;
  padding: 10px 13px;
  min-width: 0;
  justify-content: center;
  align-content: center;
}
.town .party-strip { padding: 6px 0 13px; flex: 0 0 auto; }
.party-card {
  min-width: 0;
  height: 93px;
  padding: 5px 5px 7px;
  display: grid;
  grid-template-rows: 33px min-content 4px min-content;
  gap: 3px;
  align-items: center;
  justify-items: center;
  color: var(--text);
  background: linear-gradient(165deg, #2d2525, #1c181a 82%);
  border: 1px solid #493a36;
  border-radius: 5px;
  cursor: pointer;
}
.party-card.rear-start { margin-inline-start: 2px; }
.party-card strong { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .875rem; }
.party-card small { color: var(--muted); font-size: .72rem; }
.party-card.selected { border-color: var(--gold); box-shadow: inset 0 0 0 1px #d5a66d49; background: #392822; }
.party-card.fallen { filter: grayscale(.75); opacity: .73; }
.class-mark {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border: 1px solid #805647;
  background: radial-gradient(circle, #674136, #342526);
  color: #f3cab2;
  border-radius: 50%;
  font: 650 .875rem var(--serif);
}
.mark-rogue, .mark-ranger { color: #d8d5aa; border-color: #63684a; background: radial-gradient(circle, #555738, #272c25); }
.mark-cleric { color: #f2d6a4; border-color: #796041; background: radial-gradient(circle, #5d4833, #302822); }
.mark-mage { color: #ddc4e6; border-color: #6e566c; background: radial-gradient(circle, #523c58, #2e2535); }
.meter { display: block; overflow: hidden; width: 100%; height: 5px; background: #100d10; border-radius: 10px; }
.meter i { display: block; height: 100%; border-radius: inherit; }
.meter.hp i { background: linear-gradient(90deg, #a7514d, #c27664); }
.meter.torch { width: clamp(32px, 15vw, 65px); height: 6px; }
.meter.torch i { background: linear-gradient(90deg, #b57741, #f5bc71); }
.facility-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.button.facility { height: 84px; flex-direction: column; gap: 6px; padding: 4px 2px; text-align: center; }
.facility .icon { font-size: 20px; }
.facility strong { display: block; color: #e7d5bd; font-size: .9375rem; }
.facility small { display: block; margin-top: 2px; color: var(--muted); font-size: .7rem; font-weight: 450; }
.town-entry { display: grid; gap: 8px; margin-top: auto; padding-top: 11px; }
.button.town-primary { height: 76px; font-size: 1.2rem; }
.travel-button { border-color: #4c3c34; color: var(--gold-bright); }

.floor-title { min-width: 0; display: flex; align-items: center; gap: 8px; }
.floor-title b { color: #eac58f; border: 1px solid #644c3b; border-radius: 4px; padding: 2px 5px; font: 650 .875rem Georgia, serif; }
.floor-title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #ebd4b7; font-size: .875rem; }
.dungeon-bar { gap: 10px; }
.dungeon-bar .light-status { margin-left: auto; }
.torch-icon { border-color: transparent; background: none; }
.danger-light {
  width: 7px; height: 7px; margin: 0 7px; border-radius: 50%;
  background: #d77962;
  opacity: calc(.26 + var(--danger) * .74);
  box-shadow: 0 0 calc(3px + 11px * var(--danger)) #dc6353;
}
.scene { position: relative; overflow: hidden; background-color: #121013; border-bottom: 1px solid #5b4238; }
.exploration { flex: 0 0 340px; height: 340px; }
.exploration::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  box-shadow: inset 0 0 24px #09070aa6;
}
#first-person { display: block; width: 100%; height: 100%; }
#minimap { position: absolute; top: 11px; right: 11px; z-index: 1; width: 88px; height: 88px; border: 1px solid #9c78527a; border-radius: 3px; box-shadow: 0 0 14px #0009; }
.dark-tag, .place-marker {
  position: absolute;
  z-index: 1;
  font-size: .875rem;
  color: #e4c2a2;
  border: 1px solid #725446;
  border-radius: 4px;
  background: #1b1416d9;
  padding: 6px 10px;
}
.dark-tag { left: 12px; top: 11px; }
.place-marker { bottom: 12px; left: 12px; display: flex; gap: 8px; align-items: center; }
.dungeon > .party-strip { flex: 0 0 116px; border-bottom: 1px solid #38282a; background: #181416; }
.explore-controls {
  flex: 1;
  min-height: 340px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 14px 13px max(18px, env(safe-area-inset-bottom));
  background: radial-gradient(ellipse at 55% 100%, #322422, #1c171a 75%);
}
.thumb-controls { display: grid; align-items: end; gap: 11px; grid-template-columns: minmax(0, 204px) minmax(0, 1fr); }
.d-pad { display: grid; grid-template: repeat(3, 68px) / repeat(3, minmax(0, 68px)); gap: 0; align-items: stretch; }
.button.direction { font-family: Georgia, serif; color: #dbba90; font-size: 18px; padding: 0; }
.direction.forward { grid-area: 1 / 2; border-radius: 7px 7px 3px 3px; }
.direction.left { grid-area: 2 / 1; border-radius: 7px 3px 3px 7px; }
.direction.back { grid-area: 3 / 2; border-radius: 3px 3px 7px 7px; }
.direction.right { grid-area: 2 / 3; border-radius: 3px 7px 7px 3px; }
.d-center { grid-area: 2 / 2; align-self: center; justify-self: center; color: #67483a; }
.action-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
.field-action { height: 85px; padding-inline: 2px; flex-direction: column; gap: 6px; font-size: .875rem; }
.field-action .icon, .combat-actions .icon { font-size: 1.1rem; }
.field-action.investigate { border-color: #7f5844; color: #f5dcb6; }

.telegraph {
  height: 56px;
  flex: 0 0 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  border-bottom: 1px solid #614539;
  background: #20191b;
  padding: 5px 12px;
}
.telegraph.charging { background: linear-gradient(90deg, #462421, #211719); border-color: #b56445; }
.telegraph-copy strong { margin-left: 6px; color: #f3d2aa; font-size: .875rem; }
.telegraph-copy > span { display: block; color: #eac4ad; font-size: .77rem; }
.meter.poise { width: 58px; flex-shrink: 0; }
.meter.poise i { background: #df9166; }
.battle-scene {
  height: 240px;
  flex: 0 0 240px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 5px 9px;
  background:
    radial-gradient(ellipse at 50% 82%, #7e4d304f, transparent 54%),
    linear-gradient(0deg, #191214, #100f1380 47%, #100f14ed 93%),
    #271f20;
  isolation: isolate;
}
#battle-space { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; filter: brightness(.63); }
.battle-scene.unlit .enemy-art { filter: brightness(.67); }
.encounter-lane { display: flex; flex: 1; min-height: 0; justify-content: center; align-items: end; gap: 4px; }
.enemy-card {
  position: relative;
  flex: 0 1 139px;
  width: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: end;
}
.enemy-card.boss:only-child { flex-basis: 245px; }
.enemy-card.defeated { opacity: .37; filter: grayscale(1); }

.enemy-label { z-index: 1; min-width: 0; text-align: center; max-width: 100%; padding: 3px 6px 4px; border-radius: 4px; background: #161013ea; }
.enemy-label strong { display: block; color: #ead2bc; font-size: .75rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.enemy-label small { display: block; color: #e6a38a; font-size: .6875rem; }
.enemy-hp { height: 4px; margin-top: 3px; }
.enemy-hp i { background: #c06a51; }
.art-rat { background-position: 0 0; }
.art-goblin { background-position: 50% 0; }
.art-archer { background-position: 100% 0; }
.art-shaman { background-position: 0 50%; }
.art-guard { background-position: 50% 50%; }
.art-orc { background-position: 100% 50%; }
.art-grik { background-position: 0 100%; }
.art-mogrash { background-position: 50% 100%; }
.art-child { background-position: 100% 100%; }
.battle-log {
  flex: 0 0 120px;
  padding: 9px 15px;
  background: #161217;
  border-bottom: 1px solid #443136;
  overflow: hidden;
}
.battle-log > span { display: block; color: var(--gold); font: 650 .8125rem var(--serif); letter-spacing: .1em; }
.battle-log ol, .result-log { padding: 0; margin: 5px 0 0; list-style: none; }
.battle-log li, .result-log li { padding: 2px 0; font-size: .875rem; color: #d4bfb1; }
.battle-log li::before, .result-log li::before { content: "·"; margin-right: .55em; color: #c38363; }
.battle-log li:last-child { color: #f3dcc3; }
.combat > .party-strip { flex: 0 0 118px; border-bottom: 1px solid #473238; background: #1b1519; }
.combat-controls { flex: 1; min-height: 310px; display: flex; flex-direction: column; gap: 9px; padding: 12px 13px max(14px, env(safe-area-inset-bottom)); background: #1d171b; }
.combat-mode { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.combat-mode strong, .combat-mode small { display: block; }
.combat-mode small { font-size: .8125rem; color: var(--muted); }
.mode-button { color: var(--gold); font-size: .875rem; }
.mode-button.is-auto { background: #3c2b23; border-color: #866348; }
.combat-actions { margin-top: auto; }
.combat-actions .button { font-size: .9375rem; }
.turn-button { width: 100%; height: 68px; }

.scrim {
  position: fixed;
  z-index: 5;
  inset: 0;
  background: #0d0a0ccb;
  display: flex;
  align-items: end;
  justify-content: center;
}
.sheet {
  width: min(100%, 450px);
  max-height: 83svh;
  display: flex;
  flex-direction: column;
  background: #211b1d;
  border: 1px solid #6e5145;
  border-bottom: 0;
  border-radius: 13px 13px 0 0;
  box-shadow: 0 -10px 45px #000a;
}
.sheet header { min-height: 57px; display: flex; justify-content: space-between; align-items: center; padding: 8px 14px 8px 17px; border-bottom: 1px solid #52403a; }
.sheet h2 { font: 700 1.2rem var(--serif); color: var(--gold-bright); }
.close-sheet { font-size: 24px; min-width: 40px; min-height: 40px; }
.sheet-body { overflow: auto; overscroll-behavior: contain; padding: 12px 15px max(18px, env(safe-area-inset-bottom)); }
.sheet-body p, .sheet-body blockquote { line-height: 1.6; }
.sheet-body p { margin-bottom: 7px; }
.sheet-subtitle { margin: 13px 0 5px; color: #dfbb93; font: 660 .9375rem var(--serif); }
.sheet-row {
  display: flex; justify-content: space-between; align-items: center; gap: 9px;
  padding: 7px 0; min-height: 54px; border-bottom: 1px solid #3d3032;
}
.sheet-row > div:first-child { min-width: 0; }
.sheet-row > div:first-child small, .row-actions > small { display: block; color: var(--muted); font-size: .8125rem; }
.sheet-row strong { color: #f1ddc5; }
.sheet-row .button { min-width: 67px; flex-shrink: 0; font-size: .875rem; }
.row-actions { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; justify-content: end; }
.sheet-balance { color: #d4af85; }
.button.wide { display: flex; width: 100%; margin: 8px 0; }
.sheet-row .wide { width: auto; margin: 0; }
.pair { display: flex; flex-shrink: 0; gap: 4px; }
.pair .button { min-width: 45px; }
.sheet-tabs, .stat-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; margin-bottom: 5px; }
.sheet-tabs .button { font-size: .875rem; padding-inline: 3px; }
.sheet-tabs .button.selected { color: var(--gold-bright); border-color: #93694c; background: #3b2923; }
.sheet form { display: grid; gap: 10px; }
.sheet label { display: grid; gap: 5px; color: #ead4ba; }

(function (R, root) {
  "use strict";
  const key = "test_rpg3_save_v1";
  const defaultGambits = ["heal", "interrupt", "skill", "attack"];
  const injuries = () => ({ head: 0, torso: 0, arm: 0, leg: 0 });

  function fresh() {
    return {
      schemaVersion: 3, seed: 12345, difficulty: "standard", gold: 450,
      supplies: 10, torches: 4, fireSeeds: 0, townScrolls: 1,
      unlockedCampFloors: [1], clearedFloors: [], clearedZones: [],
      party: [], roster: [], inventory: [], codex: {}, commonSense: [],
      dungeonState: null, stats: { runs: 0, steps: 0, kills: 0, deaths: 0 },
      relics: [], pouch: {}, stash: [], hiddenClears: [], claimed: [],
      nextId: 0, preferences: { mute: false, auto: false, difficultyChosen: false }
    };
  }

  function migrate(raw) {
    const defaults = fresh();
    if (!raw || typeof raw !== "object" || Array.isArray(raw)) return defaults;
    const migrated = { ...defaults, ...raw, schemaVersion: 3 };
    for (const name of ["party", "roster"]) {
      migrated[name] = Array.isArray(raw[name]) ? raw[name].filter(Boolean).map((actor) => ({
        ...actor,
        soulScars: actor.soulScars ?? 0,
        injuries: { ...injuries(), ...actor.injuries },
        gambits: Array.isArray(actor.gambits) ? actor.gambits : [...defaultGambits]
      })) : [];
    }
    for (const name of ["unlockedCampFloors", "clearedFloors", "clearedZones", "inventory", "commonSense", "relics", "stash", "hiddenClears", "claimed"]) {
      if (!Array.isArray(migrated[name])) migrated[name] = defaults[name];
    }
    for (const name of ["codex", "pouch"]) {
      if (!migrated[name] || typeof migrated[name] !== "object" || Array.isArray(migrated[name])) migrated[name] = defaults[name];
    }
    if (!Number.isSafeInteger(migrated.nextId) || migrated.nextId < 0) migrated.nextId = 0;
    migrated.stats = { ...defaults.stats, ...raw.stats };
    migrated.preferences = { ...defaults.preferences, ...raw.preferences };

    try {

      return true;
    } catch {
      return false;
    }

(function (R) {
  "use strict";
  const files = ["balance", "rules", "items", "enemies", "world"];
  let db;
  let pending;
  const index = (entries) => Object.fromEntries(entries.map((entry) => [entry.id, entry]));

  function register(data) {
    db = {
      ...data,
      races: index(data.rules.races),
      classes: index(data.rules.classes),
      actions: index([...data.rules.skills, ...data.rules.spells]),
      statuses: index(data.rules.statusEffects),
      curses: index(data.rules.curses),
      itemsById: index([...data.items.weapons, ...data.items.armors, ...data.items.consumables,
        ...data.items.uniques, ...data.items.relics]),
      enemiesById: index(Object.values(data.enemies).flat()),
      floors: Object.fromEntries(data.world.floors.map((floor) => [floor.floor, floor]))
    };
    return db;
  }

  function init() {
    if (db) return Promise.resolve(db);
    if (!pending) {
      pending = Promise.all(files.map(async (name) => {
        const response = await fetch("data/" + name + ".json");
        if (!response.ok) throw new Error(name + " 資料無法載入");
        return [name, await response.json()];
      })).then((entries) => register(Object.fromEntries(entries))).catch((error) => {
        pending = null;
        throw error;
      });

  }

      return [key, Math.max(1, (char.attributes?.[key] ?? race.stats[key]) - scars + penalty)];

    const focus = sum("focus");
    const rawPdef = sum("def") + Math.floor(VIT * 0.6);
    const blind = hasStatus(char, "blind") ? 40 : 0;
    const head = wounds.head === 2 ? 15 : 0;
    const arm = wounds.arm === 2 ? 25 : 0;
    const unarmored = equipment.every((item) => !item.def) ? (job.passive.unarmoredEva || 0) : 0;
    return {
      ...base,
      maxHp: Math.floor((25 + VIT * 4 + (char.level || 1) * job.hpGrowth) * (1 - db.balance.soulScarHpPen * scars)),
      patk: (weapon?.atk || 0) + (weapon?.mainStat === "AGI" ? AGI : STR) * 1.5,
      matk: focus + INT * 1.6,
      hatk: focus + PIE * 1.6,
      pdef: rawPdef * (wounds.torso === 2 ? 0.8 : 1) * (hasStatus(char, "armor_break") ? 0.65 : 1),
      mdef: (sum("mdef") + Math.floor((INT + PIE) * 0.4)) * (race.passive.mdef || 1),

      crit: 5 + LUK * 0.6 + 5 * affixes.filter((id) => id === "keen").length,
      spellCrit: race.passive.spellCrit || 0,

      const [a, b] = fringe[index];

      if (save.clearedZones.includes(1)) return { ok: true, loot: "ar_watch_coat", text: "塌牆後露出一只木箱。" };
      return { ok: true, text: "倒牆壓住了一只木箱。" };
    }
    return { ok: false, text: "石縫裡只有冷氣。" };
  }

  const standing = (actor) => !actor.isDead && !actor.isDying;
  function recover(actor, pct, perRing, clearLight = false, slotFactor = 1) {
    if (!standing(actor)) return;
    const factor = actor.injuries.torso === 1 ? 0.75 : 1;
    actor.hp = Math.min(actor.maxHp, actor.hp + Math.floor(actor.maxHp * pct * factor));
    actor.slots = actor.slots.map((slots, i) => {
      const recovered = Math.min(perRing, actor.maxSlots[i] - slots);
      return slots + Math.round(recovered * slotFactor);
    });
    if (clearLight) for (const part of parts) if (actor.injuries[part] === 1) actor.injuries[part] = 0;
  }

  function fireFactor(party, rng) {
    const alignments = new Set(party.filter(standing).map((actor) => actor.alignment));
    return alignments.has("good") && alignments.has("evil") && !alignments.has("neutral") && rng.next() < 0.35 ? 0.85 : 1;
  }

  function useCamp(state, party, rng, resources = state) {
    const db = R.DataLoader.getDB();
    if (resources.supplies < 1 || !Number.isInteger(resources.supplies)) return { ok: false, text: "補給袋空了。" };
    resources.supplies -= 1;
    const factor = fireFactor(party, rng);
    for (const actor of party) recover(actor, db.balance.campHealPct * factor, 1, true, factor);
    const ambush = rng.next() < db.balance.campAmbushChance;
    return { ok: true, encounter: ambush ? "normal" : null, text: factor < 1 ? "火邊起了爭執，睡得很淺。" : "分過乾糧，石道仍冷。" };
  }

  function useBonfire(state, party, mode, rng, resources = state) {
    if (!(featureAt(state) || []).includes("camp")) return { ok: false, text: "附近沒有營火。" };
    if (state.bonfireUsed) return { ok: false, text: "這趟已在營火旁休息過。" };
    if (mode !== "small" && mode !== "full") return { ok: false, text: "火堆還在等人添柴。" };
    if (mode === "full" && !(resources.supplies > 0)) return { ok: false, text: "補給袋空了。" };
    const factor = fireFactor(party, rng);
    if (mode === "full") resources.supplies -= 1;
    state.bonfireUsed = true;
    for (const actor of party) {
      recover(actor, (mode === "full" ? 1 : 0.5) * factor, mode === "full" ? Infinity : 1, mode === "full", factor);
      if (mode === "full" && factor === 1 && standing(actor)) actor.hp = actor.maxHp;
    }
    const story = mode === "full" ? R.DataLoader.getDB().world.fireStory.find((entry) => entry.floor === state.floor)?.lines : null;
    return { ok: true, story, text: factor < 1 ? "火邊的爭執擾了睡意。" : "火光把潮氣逼出衣袖。" };
  }

  function relocate(state, position) {
    [state.x, state.y] = position;
    state.facing = 0;
    reveal(state);
  }

  R.Dungeon = { size, dirs, key, cell, featureAt, passable, here, generateFloor, move, inspect, useCamp, useBonfire, relocate };

  <script>
(function (R) {
  "use strict";
  const { clamp, hasStatus, calcDamage, mapDamageVerb } = R.Formulas;
  const standing = (actor) => R.Town.active(actor);
  const attack = { id: "attack", type: "attack", name: "普攻", mult: 1, target: "single_enemy" };
  const defense = { id: "defend", type: "defend", name: "防禦", target: "self", effect: "guard" };
  const parts = ["head", "torso", "arm", "leg"];
  const ratio = (actor) => actor.hp / actor.maxHp;
  const weakest = (actors) => [...actors].sort((a, b) => ratio(a) - ratio(b))[0];

  function report(logs, text) {
    logs.push(Array.from(text.replace(/[0-9]/g, "")).slice(0, 18).join(""));
  }

  function createEncounter(floor, type, party, db, rng, options = {}) {
    const info = db.floors[floor];
    if (!info || !["normal", "elite", "boss", "hidden"].includes(type)) throw new RangeError("Unknown encounter");
    const profile = db.balance.encounters[floor];
    let ids;
    if (type === "normal") ids = profile.normal[rng.int(0, profile.normal.length - 1)];
    if (type === "elite") ids = [info.elitePool[rng.int(0, info.elitePool.length - 1)], ...profile.eliteSupport];
    if (type === "boss") ids = [info.bossId, ...(profile.bossSupport || [])];
    if (type === "hidden") ids = [info.hiddenBossId];
    if (ids.some((id) => !db.enemiesById[id])) throw new RangeError("Unknown enemy");
    const enemies = ids.map((id, i) => {
      const data = db.enemiesById[id];
      const isBoss = i === 0 && (type === "boss" || type === "hidden");
      let maxHp = data.hp;
      if (type === "elite" && i === 0) maxHp = Math.floor(data.hp * db.balance.eliteHpMult);
      if (isBoss && data.baseHp) maxHp = Math.floor(data.baseHp * db.balance.bossHpMult);
      return {
        uid: "enemy-" + i, id, name: data.name, maxHp, hp: maxHp, slot: i,
        row: data.row || "front", isBoss, isElite: i === 0 && type === "elite",
        isDead: false, isDying: false, isPlayer: false, statuses: [], cooldowns: {},
        phase: 1, isCharging: false, poise: 0, poiseMax: 0, boost: 0, buffUntil: 0
      };
    });
    for (const actor of party) {
      actor.statuses = [];
      actor.cooldowns = {};
      delete actor.guardUntil;
      delete actor.riposteUntil;
      delete actor.evadeUntil;
      delete actor.weakenUntil;
    }
    const battle = {
      party, enemies, floor, type, turn: 0, result: null,
      autoMode: options.autoMode ?? false, dark: Boolean(options.dark),
      diffMult: db.balance.difficultyMult[options.difficulty] || 1,
      gold: options.gold ?? 0, pouch: options.pouch || {}, townScrolls: options.townScrolls || 0,
      stolen: 0, stolenUntil: 0, wasStolen: false, logs: [], event: options.event || null,
      manual: {}, selected: null, prepared: false, retreat: false
    };
    prepareTurn(battle, db);
    return battle;
  }

  function currentStats(actor, battle, db) {
    const round = battle.turn;
    let output;
    if (actor.isPlayer) {
      output = R.Formulas.calcDerivedStats(actor, db);
      if (battle.dark && round <= db.balance.darkRounds) output.acc -= db.balance.darkAccPenalty;
    } else {
      const data = db.enemiesById[actor.id];
      output = {
        maxHp: actor.maxHp, patk: data.patk, matk: data.matk, hatk: data.matk,
        pdef: data.pdef * (hasStatus(actor, "armor_break") ? 0.65 : 1),
        mdef: data.mdef, acc: data.acc - (hasStatus(actor, "blind") ? 40 : 0),
        eva: data.eva, spd: data.spd, crit: data.crit ?? 8,
        weakness: actor.revealedWeakness && !data.weakness.length ? ["fire", "cold", "holy"] : data.weakness,
        resistance: data.resistance, immunity: data.immunity
      };
    }
    if (actor.armSealedUntil >= round) output.damageMult = (output.damageMult || 1) * 0.70;
    if ((actor.evadeUntil || 0) >= round && round > 0) output.eva += 30;
    return output;
  }

  function phaseCheck(enemy, db, logs) {
    if (!enemy.isBoss || enemy.isDead || enemy.phase !== 1 || enemy.hp > enemy.maxHp * 0.5) return;
    enemy.phase = 2;
    enemy.statuses = [];
    delete enemy.weakenUntil;
    delete enemy.armSealedUntil;
    enemy.isCharging = false;
    enemy.poise = 0;
    report(logs, enemy.name + "的氣息變得狂暴。");
  }

  function prepareTurn(battle, db) {
    if (battle.result || battle.prepared) return;
    for (const enemy of battle.enemies) {
      if (enemy.isDead) continue;
      phaseCheck(enemy, db, battle.logs);
      if (enemy.isBoss && !enemy.isCharging && (battle.turn + 1) % 4 === 0) {
        enemy.isCharging = true;
        enemy.poise = Math.floor(enemy.maxHp * db.balance.bossPoisePct);
        enemy.poiseMax = enemy.poise;
      }
    }
    battle.prepared = true;
  }

  function actionFor(id, actor, db) {
    if (id === "attack") return { ...attack, range: R.Formulas.gear(actor, "weapon", db)?.range || "short" };
    if (id === "defend") return defense;
    return db.actions[id];
  }

  function actionReady(actor, action, battle, db) {
    if (!action || !standing(actor)) return false;
    const turn = battle.turn + (battle.prepared ? 1 : 0);
    if (hasStatus(actor, "fear") && !["attack", "defend"].includes(action.type)) return false;
    if (action.type === "spell" && (hasStatus(actor, "silence") || actor.injuries.head === 2 ||
        (actor.slots[action.ring - 1] || 0) < action.costSp + (actor.injuries.head === 1 ? 1 : 0))) return false;
    if ((actor.cooldowns[action.id] || 0) > turn) return false;
    const weapon = R.Formulas.gear(actor, "weapon", db);
    if (action.requires === "shield" && !R.Formulas.gear(actor, "offhand", db)?.shield) return false;
    if (action.requires === "bow" && !["shortbow", "longbow", "crossbow"].includes(weapon?.category)) return false;
    if (action.requires === "blunt" && !["mace", "warhammer"].includes(weapon?.category)) return false;
    return true;
  }

  function fronts(actors, isParty, db) {
    const live = actors.filter(standing);
    const front = live.filter((target) => isParty ? target.slot < db.balance.frontSlots : target.row !== "back");
    return front.length ? front : live;
  }

  function candidates(actor, action, battle, db) {
    const allies = actor.isPlayer ? battle.party : battle.enemies;
    const foes = actor.isPlayer ? battle.enemies : battle.party;
    if (action.target === "self") return [actor];
    if (["party", "single_ally"].includes(action.target)) {
      return allies.filter((target) => !target.isDead && (action.heal || !target.isDying));
    }
    const front = fronts(foes, !actor.isPlayer, db);
    if (!actor.isPlayer) {
      if (action.target === "front_all" || action.target === "front_single") return front;
      return foes.filter(standing);
    }
    const isFront = fronts(allies, true, db).some((target) => target.uid === actor.uid);
    if (action.range === "short" && !isFront) return [];
    if (action.range === "short" || (action.range === "medium" && !isFront) || action.target === "front_enemy") return front;
    return foes.filter(standing);
  }

  function available(actor, battle, db) {
    return ["attack", "defend", ...actor.learned].map((id) => actionFor(id, actor, db))
      .filter((action) => actionReady(actor, action, battle, db) && candidates(actor, action, battle, db).length);
  }

  function evalGambit(actor, battle, db) {
    const actions = available(actor, battle, db);
    const front = fronts(battle.enemies, false, db);
    const needsHeal = weakest(battle.party.filter((ally) => !ally.isDead));
    const charge = battle.enemies.find((enemy) => !enemy.isDead && enemy.isCharging);
    const weakestEnemy = weakest(front);
    const focused = (action) => {
      const targets = candidates(actor, action, battle, db);
      return targets.includes(weakestEnemy) ? weakestEnemy : weakest(targets);
    };
    for (const condition of actor.gambits) {
      if (condition === "heal" && needsHeal && ratio(needsHeal) < 0.57) {
        const action = actions.find((item) => item.heal);
        if (action) return { type: "spell", actionId: action.id, targetId: needsHeal.uid };
      }
      if (condition === "interrupt" && charge) {
        const action = actions.find((item) => item.interrupt && candidates(actor, item, battle, db).includes(charge));
        if (action) return { type: action.type, actionId: action.id, targetId: charge.uid };
      }
      if (condition === "skill") {
        const offensive = actions.filter((item) => ["spell", "active"].includes(item.type) && !item.heal &&
          !["party", "self", "single_ally"].includes(item.target) &&
          !(item.interrupt && battle.enemies.some((enemy) => enemy.isBoss) && !charge));
        const score = (item) => {
          const target = focused(item);
          const foe = db.enemiesById[target?.id];
          const affinity = foe?.weakness.includes(item.element) ? 1.4 : foe?.resistance.includes(item.element) ? 0.6 : 1;
          return item.mult * affinity * (item.target === "all_enemy" ? 1.35 : 1) + (item.stunChance || 0) * 0.35;
        };
        offensive.sort((a, b) => score(b) - score(a));
        const action = offensive[0];
        if (action) return { type: action.type, actionId: action.id, targetId: focused(action)?.uid };
      }
      if (condition === "attack") {
        const action = actions.find((item) => item.type === "attack");
        if (action) return { type: "attack", actionId: "attack", targetId: focused(action)?.uid };
      }
    }
    return { type: "defend", actionId: "defend", targetId: actor.uid };
  }

  function enemyAction(actor, battle, db) {
    const data = db.enemiesById[actor.id];
    if (actor.isCharging) return { action: data.chargeSkill, charge: true };
    const skills = actor.phase === 2 ? [...data.skills, ...data.phase2Skills] : data.skills;
    const allowed = skills.filter((skill) => (!skill.stealGoldPct || !battle.wasStolen) &&
      (!hasStatus(actor, "silence") || !skill.element) && (!hasStatus(actor, "fear") || skill === data.skills[0]));
    return { action: allowed[(battle.turn - 1 + actor.slot) % allowed.length] ||
      { ...attack, target: "front_single" } };
  }

  function selectTargets(actor, action, targetId, battle, db, rng) {
    const targets = candidates(actor, action, battle, db);
    if (["all", "all_enemy", "front_all", "front_enemy", "party"].includes(action.target)) return targets;
    if (!targets.length) return [];
    const target = targets.find((entry) => entry.uid === targetId);
    if (target) return [target];
    if (action.target === "random") return [targets[rng.int(0, targets.length - 1)]];
    if (action.target === "injured") return [weakest(targets.filter((entry) => Object.values(entry.injuries || {}).some(Boolean))) || weakest(targets)];
    return [weakest(targets)];
  }

  function damage(target, amount, battle, logs) {
    if (!amount || target.isDead) return;
    const overflow = amount - target.hp;
    target.hp = Math.max(0, target.hp - amount);
    if (target.hp > 0) return;
    if (!target.isPlayer || overflow > target.maxHp * 1.5) {
      target.isDead = true;
      target.isDying = false;
      report(logs, target.name + "倒下了。");
    } else if (!target.isDying) {
      target.isDying = true;
      target.dyingTimer = 3 + Math.floor(target.derived.VIT / 6);
      report(logs, target.name + "只餘一線氣息。");
    }
  }

  function addStatus(target, id, duration, db, battle) {
    if (target.isDead || !db.statuses[id]) return false;
    const immunity = db.races[target.race]?.passive;
    if ((id === "sleep" && immunity?.sleepImmune) || (id === "poison" && immunity?.poisonImmune) ||
        target.derived.immunity?.includes(id)) return false;
    const timer = duration ?? db.statuses[id].duration;
    const current = target.statuses.find((entry) => entry.id === id);
    const startsNext = ["stun", "sleep"].includes(id) && target.actedTurn === battle.turn;
    if (current) {
      current.turns = Math.max(current.turns, timer);
      current.skipTick = startsNext;
    } else {
      target.statuses.push({ id, turns: timer, skipTick: startsNext });
    }
    return true;
  }

  function interrupt(target, battle, db, logs) {
    if (!target.isCharging) return;
    target.isCharging = false;
    target.poise = 0;
    addStatus(target, "stun", 1, db, battle);
    report(logs, target.name + "的架勢被擊潰。");
  }

  function applyHit(actor, target, action, battle, db, rng, logs) {
    const spell = Boolean(action.element);
    const attacker = currentStats(actor, battle, db);
    const defender = currentStats(target, battle, db);
    const guard = (target.guardUntil || 0) >= battle.turn ? 0.55 : 1;
    const aura = target.isPlayer ? Math.max(0, ...battle.party.filter(standing).map((pc) => db.classes[pc.classId].passive.aura || 0)) : 0;
    const sleeping = !spell && hasStatus(target, "sleep");
    const hurt = action.injuryMult && Object.values(target.injuries || {}).some(Boolean) ? action.injuryMult : 1;
    const boosted = actor.buffUntil >= battle.turn ? 1 + actor.boost : 1;
    const phasePower = actor.phase === 2 ? db.balance.bossPhase2DmgMult : 1;
    const weakened = (actor.weakenUntil || 0) >= battle.turn ? 0.78 : 1;
    const modifiers = {
      ...action, variance: db.balance.dmgVariance, power: boosted * weakened,
      finalMult: phasePower * guard * (1 - aura) * hurt * (sleeping ? 1.3 : 1)
    };
    const result = calcDamage(attacker, defender, modifiers, rng, actor.isPlayer ? 1 : battle.diffMult);
    if (!result.hit) {
      report(logs, actor.name + "的攻擊被側身閃開。");
      return;
    }
    if (result.dmg === 0) {
      report(logs, target.name + "未被術式所傷。");
      return;
    }
    if (sleeping) target.statuses = target.statuses.filter((item) => item.id !== "sleep");
    let amount = result.dmg;
    if (action.execute && !target.isBoss && ratio(target) < 0.23) amount = Math.max(amount, target.hp);
    damage(target, amount, battle, logs);
    report(logs, actor.name + mapDamageVerb(amount, target.maxHp) + "。");
    if (target.isCharging) {
      target.poise = Math.max(0, target.poise - amount);
      if (!target.poise || action.interrupt) interrupt(target, battle, db, logs);
    }
    if (target.isPlayer && !target.isDead && (action.inflictInjury || amount > target.maxHp * 0.35)) {
      const part = action.inflictInjury || parts[rng.int(0, parts.length - 1)];
      const level = target.injuries[part];
      const dwarf = db.races[target.race].passive.heavyThreshold || 0;
      const threshold = level === 1 && !action.inflictInjury ? 0.35 + dwarf : 0;
      if (level < 2 && amount > target.maxHp * threshold) {
        target.injuries[part] += 1;
        report(logs, target.name + "留下了傷勢。");
      }
    }
    const status = action.stunChance ? "stun" : action.status;
    if (status) {
      const chance = Math.max(0, (action.stunChance ?? action.chance ?? 1) - (defender.resistStatus || 0));
      if ((chance >= 1 || rng.next() < chance) && addStatus(target, status, action.duration, db, battle)) {
        if (status === "stun") interrupt(target, battle, db, logs);
        report(logs, target.name + "陷入" + db.statuses[status].name + "。");
      }
    }
    if (action.effect === "weaken") target.weakenUntil = battle.turn + 2;
    if (action.effect === "sealArm") target.armSealedUntil = battle.turn + 2;
    if (action.effect === "expose") target.revealedWeakness = true;
    phaseCheck(target, db, logs);

    if (target.isDead && actor.isPlayer && spell && db.classes[actor.classId].passive.slotOnKill) {
      const ring = action.ring - 1;
      actor.slots[ring] = Math.min(actor.maxSlots[ring], actor.slots[ring] + 1);
    }
    if (db.enemiesById[target.id]?.counterBurn && (action.element === "fire" || (!spell && action.range !== "long"))) {
      damage(actor, Math.ceil(actor.maxHp * 0.16 * battle.diffMult), battle, logs);
      report(logs, "餘火回捲，燙傷了" + actor.name + "。");
    }
    if (!spell && target.riposteUntil >= battle.turn && standing(target)) {
      damage(actor, Math.max(1, Math.floor(defender.patk * 0.7 - attacker.pdef)), battle, logs);
      report(logs, target.name + "沿著刃口反擊。");
    }
  }

  function heal(actor, target, action, battle, db, logs) {
    const power = currentStats(actor, battle, db).hatk;
    const factor = target.injuries.torso === 1 ? 0.75 : 1;
    target.hp = Math.min(target.maxHp, target.hp + Math.max(1, Math.floor(power * action.mult * factor)));
    target.isDying = false;
    target.dyingTimer = 0;
    if (action.lightCure) for (const part of parts) if (target.injuries[part] === 1) target.injuries[part] = 0;
    report(logs, target.name + "的傷口止住血。");
  }

  function resolveTurn(battle, playerCommands = {}, db, rng) {
    if (battle.result) return [];
    prepareTurn(battle, db);
    battle.turn += 1;
    battle.prepared = false;
    const logs = [];
    for (const enemy of battle.enemies.filter((target) => target.isCharging)) report(logs, enemy.name + "開始蓄力。");
    const actors = [...battle.party, ...battle.enemies].filter((actor) => !actor.isDead);
    const orders = new Map();
    for (const actor of actors) {
      actor.derived = currentStats(actor, battle, db);
      if (actor.isDying) continue;
      orders.set(actor.uid, actor.isPlayer ?
        (battle.retreat === actor.uid ? { type: "retreat" } : battle.autoMode ? evalGambit(actor, battle, db) : playerCommands[actor.id] || { type: "defend" }) :
        enemyAction(actor, battle, db));
    }
    for (const actor of actors) actor.turnInit = actor.derived.spd * rng.range(0.85, 1.15);
    actors.sort((a, b) => b.turnInit - a.turnInit);
    for (const actor of actors) {
      if (!standing(actor)) continue;
      if (battle.enemies.every((enemy) => enemy.isDead)) break;
      if (hasStatus(actor, "stun") || hasStatus(actor, "sleep")) {
        actor.actedTurn = battle.turn;
        if (actor.isCharging) actor.isCharging = false;
        report(logs, actor.name + "無法動彈。");
        continue;
      }
      const order = orders.get(actor.uid);
      if (!order) continue;
      actor.actedTurn = battle.turn;
      if (order.type === "retreat" && !["boss", "hidden"].includes(battle.type)) {
        for (const participant of actors) participant.derived = currentStats(participant, battle, db);
        if (rng.next() * 100 < R.Formulas.calcRetreatRate(battle.party, battle.enemies, db)) {
          battle.result = "retreated";
          report(logs, "全隊趁亂退出了戰場。");
          break;
        }
        report(logs, "退路被封死，撤退失敗。");
        continue;
      }
      if (order.type === "item") {
        if (!hasStatus(actor, "fear")) {
          const target = battle.party.find((entry) => entry.uid === order.targetId);
          const outcome = R.Town.drink(battle.pouch, target, order.itemId, db);
          report(logs, outcome.text);
        }
        afterAction(actor, battle, logs);
        continue;
      }
      let action = actor.isPlayer ? actionFor(order.actionId || order.type, actor, db) : order.action;
      if (actor.isPlayer && ((!["attack", "defend"].includes(action?.id) && !actor.learned.includes(action?.id)) ||
          !actionReady(actor, action, battle, db))) action = defense;
      if (!actor.isPlayer && ((order.charge && !actor.isCharging) ||
          (hasStatus(actor, "silence") && action.element) || (hasStatus(actor, "fear") && action !== db.enemiesById[actor.id].skills[0]))) continue;
      if (order.charge) {
        actor.isCharging = false;
        actor.poise = 0;
      }
      if (action.type === "spell" && actor.isPlayer) actor.slots[action.ring - 1] -= action.costSp + (actor.injuries.head === 1 ? 1 : 0);
      if (action.cooldown) actor.cooldowns[action.id] = battle.turn + action.cooldown + 1;
      if (action.target === "buff") {
        for (const ally of battle.enemies.filter(standing)) {

(function (R) {

  const db = () => R.DataLoader.getDB();

  const fail = (text) => ({ ok: false, text });
  const all = (state) => [...state.party, ...state.roster];
  const find = (state, id) => all(state).find((actor) => actor.id === id);
  const parts = ["head", "torso", "arm", "leg"];
  const alignment = ["good", "neutral", "evil"];
  const active = (actor) => !actor.isDead && !actor.isDying;

  function slotCaps(actor, data) {
    const base = data.classes[actor.classId].base || actor.classId;
    if (!["mage", "cleric"].includes(base) && !["lord"].includes(actor.classId)) return [0, 0, 0];
    return [Math.min(9, 4 + Math.floor((actor.level - 1) / 2)),
      actor.level >= 4 ? Math.min(7, 2 + Math.floor((actor.level - 4) / 2)) : 0,

  function refresh(actor, fill = false, data = db()) {

    actor.maxHp = actor.derived.maxHp;

  function makeActor(state, input, data = db()) {

    const actor = {
      id, uid: id, name: input.name, race: input.race, classId: input.classId, alignment: input.alignment,

      if (!data.classes[actor.classId]) actor.classId = "fighter";

  let context;
  let muted = false;
  const sounds = {
    step: [68, 45, 0.075, "triangle", 0.045],
    hit: [135, 48, 0.16, "sawtooth", 0.045],
    warn: [122, 76, 0.26, "triangle", 0.055],

    try {

      if (context.state === "suspended") context.resume().catch(() => {});

  function play(name) {
    if (muted || !context || context.state !== "running" || !sounds[name]) return;

    const now = context.currentTime;
    const pitch = context.createOscillator();
    const gain = context.createGain();
    pitch.type = wave;
    pitch.frequency.setValueAtTime(from, now);
    pitch.frequency.exponentialRampToValueAtTime(to, now + duration);
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(volume, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    pitch.connect(gain);
    gain.connect(context.destination);
    pitch.start(now);
    pitch.stop(now + duration);
    pitch.onended = () => { pitch.disconnect(); gain.disconnect(); };

    setMute(value) { muted = Boolean(value); },
